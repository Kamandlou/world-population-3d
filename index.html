<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Population 3D Globe</title>
  <!-- Load local Globe.gl with fallback to CDN -->
  <script src="globe.gl.min.js"></script>
  <script>
    if (typeof Globe === 'undefined') {
      document.write('<script src="https://unpkg.com/globe.gl"><\/script>');
    }
  </script>
  <!-- Load GeoJSON data with country populations -->
  <script src="countries-data.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #040711;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }
    .panel {
      background: rgba(13, 20, 36, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 20px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #header-panel {
      top: 20px;
      left: 20px;
      max-width: 340px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-box {
      flex: 1;
    }
    .stat-label {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #38bdf8;
      margin-top: 2px;
    }
    #legend-panel {
      bottom: 24px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-bar {
      width: 220px;
      height: 10px;
      border-radius: 5px;
      background: linear-gradient(to right, #1e3a8a, #0284c7, #10b981, #f59e0b, #ef4444);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
    }
    #controls-panel {
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    .btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    /* Custom tooltip styling for Globe.gl default tooltip */
    .scene-tooltip {
      background: rgba(10, 15, 29, 0.9) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      border: 1px solid rgba(56, 189, 248, 0.35) !important;
      border-radius: 8px !important;
      padding: 10px 14px !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <div id="globeViz"></div>

  <div class="hud panel" id="header-panel">
    <h1>World Population 3D</h1>
    <div class="subtitle">Global population distribution visualized on a 3D Earth model. Altitude & color represent population size.</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Countries</div>
        <div class="stat-value" id="total-countries">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Population</div>
        <div class="stat-value" id="total-pop">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Highest</div>
        <div class="stat-value" id="max-country">-</div>
      </div>
    </div>
  </div>

  <div class="hud panel" id="legend-panel">
    <div class="legend-labels">
      <span>Low (&lt;10M)</span>
      <span>Medium (~100M)</span>
      <span>High (1B+)</span>
    </div>
    <div class="legend-bar"></div>
  </div>

  <div class="hud" id="controls-panel">
    <button class="btn active" id="btn-rotate" onclick="toggleRotation()">
      <span id="rotate-icon">⏸</span> Auto-Rotate
    </button>
    <button class="btn" onclick="resetView()">Reset View</button>
  </div>

  <script>
    const MAX_POP = 1400000000;
    let autoRotate = true;
    let hoveredCountry = null;

    function getPopColor(pop, isHovered) {
      if (isHovered) return 'rgba(255, 255, 255, 0.95)';
      if (!pop || pop <= 0) return 'rgba(30, 41, 59, 0.6)';

      const t = Math.min(1, Math.sqrt(pop / MAX_POP)); // sqrt scaling

      const stops = [
        { t: 0.0, r: 30,  g: 58,  b: 138 }, // deep blue
        { t: 0.2, r: 2,   g: 132, b: 199 }, // sky blue
        { t: 0.45, r: 16, g: 185, b: 129 }, // emerald green
        { t: 0.7, r: 245, g: 158, b: 11  }, // amber
        { t: 1.0, r: 239, g: 68,  b: 68  }  // crimson red
      ];

      let low = stops[0], high = stops[stops.length - 1];
      for (let i = 0; i < stops.length - 1; i++) {
        if (t >= stops[i].t && t <= stops[i + 1].t) {
          low = stops[i];
          high = stops[i + 1];
          break;
        }
      }

      const factor = (t - low.t) / (high.t - low.t || 1);
      const r = Math.round(low.r + factor * (high.r - low.r));
      const g = Math.round(low.g + factor * (high.g - low.g));
      const b = Math.round(low.b + factor * (high.b - low.b));

      return `rgba(${r}, ${g}, ${b}, 0.88)`;
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('en-US').format(num);
    }

    function formatCompact(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(2) + ' Billion';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + ' Million';
      if (num >= 1e3) return (num / 1e3).toFixed(0) + 'K';
      return num ? num.toString() : '0';
    }

    // Initialize Globe
    const globe = Globe()(document.getElementById('globeViz'))
      .backgroundColor('#040711')
      .showAtmosphere(true)
      .atmosphereColor('#38bdf8')
      .atmosphereAltitude(0.2)
      .polygonAltitude(feat => {
        const pop = feat.properties.POP_EST || 0;
        return Math.min(0.25, Math.max(0.012, Math.sqrt(pop / MAX_POP) * 0.22));
      })
      .polygonCapColor(feat => getPopColor(feat.properties.POP_EST, feat === hoveredCountry))
      .polygonSideColor(feat => {
        const pop = feat.properties.POP_EST || 0;
        const color = getPopColor(pop, false);
        return color.replace('0.88', '0.45');
      })
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.2)')
      .polygonsTransitionDuration(250)
      .polygonLabel(({ properties: d }) => `
        <div style="font-family: inherit;">
          <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">${d.NAME || d.ADMIN || 'Unknown'}</div>
          <div style="color: #38bdf8; font-weight: 600; font-size: 13px;">👥 ${formatNumber(d.POP_EST)} (${formatCompact(d.POP_EST)})</div>
          <div style="color: #94a3b8; font-size: 11px; margin-top: 4px;">Region: ${d.REGION_UN || d.CONTINENT || 'N/A'}</div>
        </div>
      `)
      .onPolygonHover((hoverD) => {
        hoveredCountry = hoverD;
        globe.polygonCapColor(globe.polygonCapColor());
      });

    // Dark base sphere
    globe.globeMaterial().color.set('#0e172a');

    // Controls setup
    const controls = globe.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    function toggleRotation() {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      updateRotateBtn();
    }

    function updateRotateBtn() {
      const btn = document.getElementById('btn-rotate');
      const icon = document.getElementById('rotate-icon');
      if (autoRotate) {
        btn.classList.add('active');
        icon.textContent = '⏸';
      } else {
        btn.classList.remove('active');
        icon.textContent = '▶';
      }
    }

    function resetView() {
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.3 }, 1000);
      autoRotate = true;
      controls.autoRotate = true;
      updateRotateBtn();
    }

    function render(data) {
      globe.polygonsData(data.features);

      let totalPop = 0;
      let maxPop = 0;
      let maxCountry = '';

      data.features.forEach(f => {
        const pop = f.properties.POP_EST || 0;
        totalPop += pop;
        if (pop > maxPop) {
          maxPop = pop;
          maxCountry = f.properties.NAME || f.properties.ADMIN;
        }
      });

      document.getElementById('total-countries').textContent = data.features.length;
      document.getElementById('total-pop').textContent = (totalPop / 1e9).toFixed(2) + 'B';
      document.getElementById('max-country').textContent = maxCountry;

      globe.pointOfView({ lat: 25, lng: 30, altitude: 2.3 });
    }

    // Load data
    if (window.countriesGeoJson) {
      render(window.countriesGeoJson);
    } else {
      fetch('countries.geojson')
        .then(r => r.json())
        .then(data => render(data))
        .catch(err => console.error('Data load error:', err));
    }
  </script>
</body>
</html>
